# Read the docs here: https://pre-commit.com
# List of some available hooks: https://pre-commit.com/hooks.html
#
# Install `pre-commit`:
#
#   $ pip install pre-commit
#
# Install hooks to your clone:
#   $ pre-commit install
#

default_stages: [pre-commit]
default_install_hook_types: [commit-msg, pre-commit, pre-push]
fail_fast: false

repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
            args: ["--markdown-linebreak-ext=md"]
          - id: no-commit-to-branch
            args:
                [
                    "--pattern",
                    '^(?!((main|(fix|feat|chore|release|doc|refactor|test)/[a-zA-Z0-9\-]+)$).*)$',
                ]
            stages: [pre-push]
          - id: check-merge-conflict
            args: ["--assume-in-merge"]
    - repo: https://github.com/adhtruong/mirrors-typos
      rev: v1.36.1
      hooks:
          - id: typos
            # NOTE Override hook's default args to prevent automatic
            # fixing of found typos. Let the dev decide what to fix!
            args: ["--force-exclude"]
            stages: [commit-msg, pre-commit]
    - repo: https://github.com/commitizen-tools/commitizen
      rev: v4.9.1
      hooks:
          - id: commitizen
    - repo: https://github.com/pre-commit/mirrors-clang-format
      rev: "v20.1.8"
      hooks:
          - id: clang-format
            args: ["--dry-run", "--style=file", "-Werror"]
